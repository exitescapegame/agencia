<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D0F">
<title>ÍRIS · Agência Exit</title>
<style>@font-face{font-family:'Barlow Condensed';src:url(fonts/BarlowCondensed-SemiBold.ttf) format('truetype');font-weight:600;font-display:swap}@font-face{font-family:'Barlow Condensed';src:url(fonts/BarlowCondensed-Bold.ttf) format('truetype');font-weight:700;font-display:swap}@font-face{font-family:'IBM Plex Mono';src:url(fonts/IBMPlexMono-Regular.ttf) format('truetype');font-weight:400;font-display:swap}@font-face{font-family:'IBM Plex Mono';src:url(fonts/IBMPlexMono-SemiBold.ttf) format('truetype');font-weight:600;font-display:swap}@font-face{font-family:'IBM Plex Sans';src:url(fonts/IBMPlexSans-Regular.ttf) format('truetype');font-weight:400;font-display:swap}@font-face{font-family:'IBM Plex Sans';src:url(fonts/IBMPlexSans-SemiBold.ttf) format('truetype');font-weight:600;font-display:swap}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:300;display:flex;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(3,10,22,.92) 40%)}
#tabbar button{font:700 18px var(--cond);letter-spacing:.12em;color:#fff;background:#7A1A22;border:1px solid #C0414B;border-radius:8px;padding:12px 22px;box-shadow:0 0 18px rgba(192,65,75,.35)}
#tabov{position:fixed;inset:0;z-index:400;display:grid;place-items:center;background:rgba(2,7,16,.94);color:#E8EEF7;text-align:center;padding:24px}
#tabov .bx{width:min(560px,100%);border:1px solid var(--line);border-radius:10px;padding:28px 24px;background:#06142A}
#tabov h3{font:700 34px/1.05 var(--cond);letter-spacing:.08em;margin:0 0 10px}
#tabov p{font:400 13px/1.6 var(--mono);color:var(--mut);letter-spacing:.06em;margin:0 0 18px}
#tabov .lg{font:400 13px/1.7 var(--mono);color:#7FD3A0;text-align:left;white-space:pre-wrap;min-height:120px;margin:0 0 14px}
#tabov .cdn{font:700 72px/1 var(--cond);color:#E3C580;margin:6px 0 14px}
#tabov .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#tabov.lock{background:#010409}#tabov.lock h3{color:#E2574C}
.padlock{width:64px;height:64px;margin:0 auto 14px;border:3px solid #E2574C;border-radius:10px;position:relative}
.padlock:before{content:'';position:absolute;left:12px;right:12px;top:-26px;height:30px;border:3px solid #E2574C;border-bottom:0;border-radius:18px 18px 0 0}
</style>
<style>
:root{
  color-scheme:dark;
  /* Institucional: azul-marinho, branco e dourado (padrão PF / FBI / CIA). Vermelho só para alerta. */
  --bg:#071428; --bg2:#0B1D3A; --panel:#0F2547; --line:#1E3A66; --line2:#2C4E82;
  --txt:#F2F5FA; --mut:#9FB2CC; --amb:#C9A24A; --amb2:#E3C580; --grn:#3FB27F; --red:#D64545; --blue:#4F7FD9;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --cond:'Barlow Condensed','Arial Narrow',sans-serif; --sans:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100%}
body{background:radial-gradient(1200px 700px at 50% -10%,#123064 0%,var(--bg) 62%) fixed}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vph{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;text-align:center;background:linear-gradient(160deg,#0F2547,#071428);font:600 12px/1.6 var(--mono);color:var(--mut);padding:12px}
#simbar{position:fixed;left:0;right:0;bottom:0;z-index:90;background:#1A1206;border-top:2px solid var(--amb);padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#simbar b{font:700 13px var(--cond);letter-spacing:.14em;color:var(--amb2);margin-right:4px}
#simbar button{border:1px solid var(--amb);background:transparent;color:var(--amb2);border-radius:3px;padding:7px 9px;font:600 11px var(--mono)}
body.sim .wrap,body.sim .term{padding-bottom:110px}
.classbar{background:var(--amb);color:#0B1D3A;font:600 10px/1 var(--mono);letter-spacing:.2em;text-align:center;padding:6px 0;position:sticky;top:0;z-index:20}
.classbar.red{background:var(--red);color:#fff}
.top{display:flex;align-items:center;gap:12px;padding:16px 0 14px;border-bottom:1px solid var(--line)}
.seal{width:48px;height:48px;border-radius:50%;flex:none;overflow:hidden;background:var(--panel)}
.seal img{width:100%;height:100%;object-fit:cover;display:block}
.top h1{font:700 22px/1 var(--cond);letter-spacing:.06em;margin:0}
.top small{display:block;font:400 10px/1.4 var(--mono);color:var(--mut);letter-spacing:.12em;margin-top:4px}
.clock{margin-left:auto;text-align:right;font:600 18px/1 var(--mono);color:var(--amb2)}
.clock small{text-align:right}
.lbl{font:600 10px/1 var(--mono);letter-spacing:.18em;color:var(--mut);text-transform:uppercase;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:6px;padding:16px;position:relative}
.cred{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center}
.photo{width:76px;height:96px;border:1px solid var(--line2);border-radius:3px;background:linear-gradient(160deg,#16335F,#0B1D3A);display:grid;place-items:center;font:600 22px var(--cond);color:var(--amb)}
.kv{font:400 10px/1 var(--mono);color:var(--mut);letter-spacing:.14em;margin-top:8px}
.kv:first-child{margin-top:0}
.kv b{display:block;font:600 15px/1.25 var(--mono);color:var(--txt);letter-spacing:.02em;margin-top:3px}
.status{position:absolute;top:12px;right:12px;font:600 10px var(--mono);letter-spacing:.14em;color:var(--grn);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.brief p{margin:0 0 8px;font-size:14px;line-height:1.55;color:#C9D0D6}
.brief .case{font:600 11px var(--mono);color:var(--amb2);letter-spacing:.12em;margin-bottom:8px}
.lock{display:flex;gap:14px;align-items:center}
.lock svg{flex:none}
.lock p{margin:0;font-size:14px;color:#C9D0D6;line-height:1.45}
.lock small{display:block;font:400 11px var(--mono);color:var(--mut);margin-top:4px}
.vid{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px;background:#000}
.vid header{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--panel);font:600 11px var(--mono);letter-spacing:.12em}
.vid header span:last-child{color:var(--red);display:flex;gap:6px;align-items:center}
.vid video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.vid footer{display:flex;gap:8px;padding:8px 12px;background:var(--bg2)}
.chip{border:1px solid var(--line2);background:transparent;border-radius:3px;padding:7px 10px;font:600 11px var(--mono);letter-spacing:.1em;color:var(--txt)}
.chip.on{border-color:var(--amb);color:var(--amb2);background:rgba(232,163,61,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:4px;padding:15px;background:var(--amb);color:#0B1D3A;font:700 17px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase}
.btn.ghost{background:transparent;border:1px solid var(--amb);color:var(--amb2)}
.btn.red{background:var(--red);color:#fff}
.btn.grn{background:var(--grn);color:#062}
.btn:disabled{opacity:.35}
.hint{border-left:3px solid var(--amb);padding:10px 12px;background:rgba(232,163,61,.06);margin-bottom:10px;font-size:14px;line-height:1.5}
.hint small{display:block;font:600 10px var(--mono);letter-spacing:.14em;color:var(--amb2);margin-bottom:4px}
input.field{width:100%;background:#081830;border:1px solid var(--line2);border-radius:4px;padding:14px;color:var(--txt);font:600 18px var(--mono);letter-spacing:.1em;text-transform:uppercase;outline:none}
input.field:focus{border-color:var(--amb)}
.muted{color:var(--mut);font-size:13px;line-height:1.5}
.foot{margin-top:28px;text-align:center;font:400 10px/1.6 var(--mono);color:#56616B;letter-spacing:.12em}
.hidden{display:none!important}
/* TERMINAL */
.term{min-height:100vh;display:flex;flex-direction:column}
.term .scr{flex:1;display:grid;place-items:center;padding:24px 24px 120px}
body.tabon .wrap{padding-bottom:120px}
@media (max-height:820px){.term .scr{place-items:start center;padding:12px 24px 90px}.term h2{font-size:32px}.term .sub{margin-bottom:12px}.pinrow{margin-bottom:12px}.pin{width:60px;height:64px;font-size:38px}.pad{gap:8px}.pad button{height:58px}#tabbar{padding:6px 14px calc(6px + env(safe-area-inset-bottom))}#tabbar button{font-size:15px;padding:8px 18px}}
.term .box{width:min(720px,100%)}
.term h2{font:700 44px/1 var(--cond);letter-spacing:.08em;margin:0 0 6px;text-align:center}
.term .sub{font:400 13px var(--mono);color:var(--mut);letter-spacing:.16em;text-align:center;margin-bottom:28px}
.pinrow{display:flex;gap:14px;justify-content:center;margin-bottom:26px}
.pin{width:78px;height:96px;border:2px solid var(--line2);border-radius:6px;display:grid;place-items:center;font:600 52px var(--mono);color:var(--txt);background:#081830}
.pin.f{border-color:var(--amb);box-shadow:0 0 18px rgba(201,162,74,.25)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;margin:0 auto}
.pad button{height:78px;border:1px solid var(--line2);background:var(--panel);border-radius:6px;font:600 30px var(--mono)}
.pad button:active{background:#173563}
.pad .k2{font:700 18px var(--cond);letter-spacing:.12em}
.log{font:400 14px/1.7 var(--mono);color:var(--txt);white-space:pre-wrap;min-height:220px}
.bar{height:10px;border:1px solid var(--grn);border-radius:2px;margin:18px 0}
.bar i{display:block;height:100%;width:0;background:var(--grn);transition:width .2s linear}
.qrbox{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.qrbox .qr{background:#fff;padding:0;border-radius:6px;width:360px;height:360px;max-width:90vw;max-height:90vw}
.qrbox .qr svg{width:100%;height:100%;display:block;image-rendering:pixelated}
.alarm{animation:alarm .5s steps(1) infinite}
@keyframes alarm{50%{background:#3A0F18}}
/* MESTRE */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scene{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:14px 12px;text-align:left}
.scene b{display:block;font:700 18px/1.1 var(--cond);letter-spacing:.08em}
.scene small{display:block;font:400 11px/1.4 var(--mono);color:var(--mut);margin-top:6px}
.scene.hot{border-color:var(--red)}
.tbl{width:100%;border-collapse:collapse;font:400 12px var(--mono)}
.tbl th{font:600 10px var(--mono);letter-spacing:.12em;color:var(--mut);text-align:center;padding:6px 2px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 2px;border-bottom:1px solid var(--line);text-align:center}
.tick{width:26px;height:26px;border:1px solid var(--line2);border-radius:3px;background:transparent;font:600 11px var(--mono);padding:0}
.tick.on{background:var(--grn);border-color:var(--grn);color:#062}
.big{font:600 64px/1 var(--mono);text-align:center;color:var(--amb2);letter-spacing:.04em}
/* TELÃO · transmissão oficial */
#stage{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:radial-gradient(ellipse at 50% 42%,#123064 0%,#071428 58%,#030A16 100%);color:var(--txt);overflow:hidden}
#stage.on{display:flex}
#stage .sbar{display:flex;align-items:center;gap:18px;padding:14px max(28px,env(safe-area-inset-right,0px)) 14px max(28px,env(safe-area-inset-left,0px));border-bottom:1px solid rgba(201,162,74,.35);background:rgba(3,10,22,.55);font:600 clamp(11px,1.15vw,15px) var(--mono);letter-spacing:.22em}
#stage .sbar .t{color:var(--amb2)}
#stage .sbar .live{margin-left:auto;color:#fff;display:flex;align-items:center;gap:8px}
#stage .sbar .live i{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:pulse 1.2s infinite}
#stage .sbar .clk{color:var(--mut)}
#stage .core{flex:1;display:grid;place-items:center;position:relative;min-height:0}
#stage canvas#ring{width:min(62vh,62vw);height:min(62vh,62vw);display:block}
#stage .sealbig{position:absolute;width:min(30vh,30vw);height:min(30vh,30vw);border-radius:50%;overflow:hidden;box-shadow:0 0 60px rgba(201,162,74,.25)}
#stage .sealbig img{width:100%;height:100%;object-fit:cover;display:block}
#stage canvas#wave{width:min(900px,80vw);height:70px;display:block;margin:0 auto}
#stage .sub{min-height:3.2em;padding:10px max(28px,6vw) 6vh;text-align:center;font:600 clamp(20px,3vw,42px)/1.35 var(--sans);color:#fff;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#stage .who{font:600 clamp(11px,1.1vw,14px) var(--mono);letter-spacing:.3em;color:var(--amb2);text-align:center;margin-top:14px}
#stage .scan{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--amb2),transparent);box-shadow:0 0 24px var(--amb2);top:-4px;pointer-events:none}
#stage.entra .scan{animation:scan 1.1s ease-out forwards}
@keyframes scan{to{top:100%}}
#stage.entra .core{animation:aparece 1.1s ease-out}
@keyframes aparece{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:none}}
#stage .fimtx{position:absolute;inset:0;display:none;place-items:center;font:600 clamp(14px,1.6vw,20px) var(--mono);letter-spacing:.4em;color:var(--mut);background:#030A16}
#stage.sai .fimtx{display:grid}
#stage.alerta{background:radial-gradient(ellipse at 50% 42%,#5A1220 0%,#1A0710 60%,#08030A 100%)}
#stage .close{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:max(12px,env(safe-area-inset-right,0px));opacity:.3;border:1px solid #445;background:none;color:#aab;padding:8px 12px;font:600 11px var(--mono);z-index:3}
@media (prefers-reduced-motion:reduce){#stage.entra .scan,#stage.entra .core{animation:none}}
/* PERÍCIA / DIGITAIS */
.scan{position:relative;aspect-ratio:1/1;max-width:100%;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#132C55,#071428)}
.scan canvas{width:100%;height:100%;display:block}
.scan .lin{position:absolute;left:0;right:0;height:2px;background:var(--amb2);box-shadow:0 0 14px var(--amb2);top:0;opacity:0}
.scan.on .lin{opacity:1;animation:varre 1.4s linear infinite}
@keyframes varre{to{top:100%}}
.ev{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev img{width:54px;height:54px;border-radius:4px;background:#071428;flex:none}
.ev .t{flex:1;min-width:0;font-size:14px}
.ev .t small{display:block;font:400 11px var(--mono);color:var(--mut);margin-top:2px}
.pct{font:600 28px var(--mono);color:var(--amb2)}
.match{border:1px solid var(--grn);background:rgba(63,178,127,.08);border-radius:6px;padding:12px;margin-top:10px}
#splash{position:fixed;inset:0;z-index:200;background:radial-gradient(ellipse at 50% 40%,#123064,#071428 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;transition:opacity .6s}
#splash img{width:min(42vw,200px);height:min(42vw,200px);border-radius:50%}
#splash b{font:700 clamp(22px,4vw,34px)/1.1 var(--cond);letter-spacing:.08em;color:var(--amb2)}
#splash small{font:400 12px/1.6 var(--mono);color:var(--mut);letter-spacing:.14em;max-width:420px}
/* CERTIFICADO */
canvas#cert{width:100%;border:1px solid var(--line);border-radius:6px}

/* TELA DA TV (corrida das equipes) */
body.tvmode{overflow:hidden}body.tvmode *:focus{outline:none}
#tv{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 40%,#123064 0%,#071428 58%,#030A16 100%);color:var(--txt);overflow:hidden;font-size:min(1vw,1.78vh)}
#tv .bar{height:4.4em;display:flex;align-items:center;gap:1.1em;padding:0 2.3em;border-bottom:1px solid rgba(201,162,74,.35);background:rgba(3,10,22,.55);font:600 1.05em var(--mono);letter-spacing:.18em}
#tv .bar img{width:3em;height:3em;border-radius:50%}#tv .bar .t{color:var(--amb2)}#tv .bar .m{color:var(--mut)}
#tv .live{margin-left:auto;display:flex;align-items:center;gap:.5em}#tv .live i{width:.75em;height:.75em;border-radius:50%;background:var(--red);box-shadow:0 0 .7em var(--red);animation:pulse 1.2s infinite}
#tv .topo{display:flex;align-items:flex-end;justify-content:space-between;padding:1.3em 3.6em .2em}
#tv h1{margin:0;font:700 5em/0.9 var(--cond);letter-spacing:.04em}#tv h1 small{display:block;font:600 .23em var(--mono);letter-spacing:.3em;color:var(--amb2);margin-bottom:.55em}
#tv .crono{text-align:right}#tv .crono b{display:block;font:700 6.9em/.85 var(--cond);color:var(--amb2);text-shadow:0 0 .25em rgba(227,197,128,.35)}#tv .crono b.fim{color:var(--red);text-shadow:0 0 .25em rgba(214,69,69,.5)}#tv .crono span{font:600 .95em var(--mono);letter-spacing:.3em;color:var(--mut)}
#tv .pista{margin:1.3em 3.6em 0}
#tv .marcos{display:grid;grid-template-columns:17.5em repeat(5,1fr) 6.2em;font:600 .95em var(--mono);letter-spacing:.12em;color:var(--mut);text-align:center;margin-bottom:.4em}
#tv .marcos>div:nth-child(n+2):nth-child(-n+6){border-left:1px dashed rgba(159,178,204,.25)}
#tv .raia{display:grid;grid-template-columns:17.5em 1fr 6.2em;align-items:center;height:6.1em;border-top:1px solid rgba(201,162,74,.18)}#tv .raia:last-child{border-bottom:1px solid rgba(201,162,74,.18)}
#tv .eq{display:flex;align-items:center;gap:.95em}#tv .pos{width:2.9em;height:2.9em;border-radius:50%;display:grid;place-items:center;font:700 1.75em var(--cond);background:#0F2547;border:2px solid var(--line);color:var(--mut);flex:none}
#tv .pos.p1{background:var(--amb);color:#071428;border-color:var(--amb2);box-shadow:0 0 1.2em rgba(227,197,128,.55)}
#tv .eq b{font:700 2.5em var(--cond);letter-spacing:.05em}#tv .eq small{display:block;font:400 .8em var(--mono);color:var(--mut);letter-spacing:.12em}
#tv .trilho{position:relative;height:100%;display:grid;grid-template-columns:repeat(5,1fr)}
#tv .seg{position:relative;border-left:1px dashed rgba(159,178,204,.25)}
#tv .seg:after{content:'';position:absolute;left:0;right:0;top:50%;height:.32em;margin-top:-.16em;background:rgba(159,178,204,.14);border-radius:.16em;transition:background .8s}
#tv .seg.ok:after{background:linear-gradient(90deg,var(--amb),var(--amb2));box-shadow:0 0 .7em rgba(227,197,128,.45)}
#tv .seg .h{position:absolute;right:.6em;top:1.1em;font:600 .9em var(--mono);color:var(--amb2)}
#tv .seg .chk{position:absolute;right:-.95em;top:50%;margin-top:-.95em;width:1.9em;height:1.9em;border-radius:50%;background:var(--amb);display:grid;place-items:center;font:700 1.05em var(--cond);color:#071428;z-index:2}
#tv .carro{position:absolute;top:50%;width:4.1em;height:4.1em;margin:-2.05em 0 0 -2.05em;border-radius:50%;border:3px solid var(--amb2);box-shadow:0 0 1.6em rgba(227,197,128,.6);z-index:3;transition:left 1.2s cubic-bezier(.3,1.4,.5,1)}
#tv .carro img{width:100%;height:100%;border-radius:50%;display:block}
#tv .dicas{text-align:center;font:600 .8em var(--mono);letter-spacing:.14em;color:var(--mut)}#tv .dicas b{display:block;font:700 2.9em var(--cond);color:var(--txt)}
#tv .ticker{position:relative;margin:1.1em 2.2em 1.6em;height:3.8em;flex:none;display:flex;align-items:center;gap:1.1em;padding:0 1.6em;background:linear-gradient(90deg,rgba(201,162,74,.22),rgba(201,162,74,.05));border-left:.32em solid var(--amb2);font:600 1.55em var(--sans)}

<script>
/* =====================================================================
   FX · filtros de selfie da Operação XII (Agência Exit)
   Só filtros de moldura (nada colado no rosto). Quadro final 1080x1920 (9:16).
   Tudo roda no próprio celular; nenhuma foto sai do aparelho.
   ===================================================================== */
const FX=(()=>{
const W=1080,H=1920;
const OURO='#E3C580',NAVY='7,20,40',CIANO='#AAD7EB';
const IMG={};
function img(n){if(!IMG[n]){const i=new Image();i.decoding='async';i.src='img/fx/'+n;IMG[n]=i}return IMG[n]}
const pronta=i=>!!(i&&i.complete&&i.naturalWidth>0);
const FILTROS=[['niver','#GABIFEZ12'],['revista','CAPA DE REVISTA'],['polaroid','POLAROID'],['scanner','SCANNER ÍRIS'],['noite','VISÃO NOTURNA']];
const PERFIS=['O DETETIVE','OPERAÇÕES ESPECIAIS','O INFILTRADO','O DECIFRADOR'];

/* ---------- textos e peças ---------- */
function txt(x,t,X,Y,font,cor,al,sombra){x.font=font;x.textAlign=al||'center';x.textBaseline='middle';if(sombra){x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=14}x.fillStyle=cor;x.fillText(t,X,Y);x.shadowBlur=0;x.shadowColor='transparent'}
function caixa(x,x0,y0,w,h,a,borda){x.fillStyle=`rgba(${NAVY},${a})`;x.fillRect(x0,y0,w,h);if(borda){x.strokeStyle=borda;x.lineWidth=2;x.strokeRect(x0+1,y0+1,w-2,h-2)}}
function marca(x){const l=img('logo_exit.webp');if(!pronta(l))return;const lw=120,lh=l.height*lw/l.width;x.globalAlpha=.75;x.drawImage(l,W-lw-36,H-lh-36,lw,lh);x.globalAlpha=1}
function tags(x,y){
  const f='600 22px "IBM Plex Mono",monospace',a='#GABIFEZ12  ·  #OperaçãoXII  ·  ',b='   Salvador · BA';x.font=f;
  const tw=x.measureText(a+b).width,x0=W/2-tw/2;txt(x,a+b,x0,y,f,'#E6E6E6','left',1);
  const px=x0+x.measureText(a).width+8;x.fillStyle='#EB5050';x.beginPath();x.arc(px,y-8,7,0,7);x.fill();
  x.beginPath();x.moveTo(px-6,y-5);x.lineTo(px+6,y-5);x.lineTo(px,y+7);x.fill();x.fillStyle=`rgb(${NAVY})`;x.beginPath();x.arc(px,y-9,3,0,7);x.fill()
}
function degrade(x,y0,alt,a){const g=x.createLinearGradient(0,y0,0,y0+alt);g.addColorStop(0,`rgba(${NAVY},0)`);g.addColorStop(1,`rgba(${NAVY},${a})`);x.fillStyle=g;x.fillRect(0,y0,W,H-y0)}
const CONF=(()=>{let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647,o=[];for(let i=0;i<140;i++)o.push([r()*W,r()*H*.75,5+r()*8,r()<.5,['227,197,128','201,162,74','245,225,170'][Math.floor(r()*3)]]);return o})();

/* ---------- câmera ---------- */
function enquadra(f){const vw=f.videoWidth||f.width,vh=f.videoHeight||f.height,s=Math.max(W/vw,H/vh);return{vw,dw:vw*s,dh:vh*s,ox:(W-vw*s)/2,oy:(H-vh*s)/2}}
function cam(x,c){const q=c.q;x.save();if(c.esp){x.translate(W,0);x.scale(-1,1)}x.drawImage(c.fonte,q.ox,q.oy,q.dw,q.dh);x.restore()}
let tmp=null;
function desfoca(x,c){ // desfoque sem ctx.filter (o iPhone não tem): reduz e amplia
  if(!tmp){tmp=document.createElement('canvas');tmp.width=54;tmp.height=96}
  const t=tmp.getContext('2d');t.save();t.scale(54/W,96/H);cam(t,c);t.restore();
  x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(tmp,0,0,W,H)
}

/* ---------- cenas ---------- */
const CENAS={};
CENAS.niver=(x,c)=>{
  cam(x,c);
  const vg=x.createRadialGradient(W/2,H*.4,W*.45,W/2,H*.4,W*1.1);vg.addColorStop(0,`rgba(${NAVY},0)`);vg.addColorStop(1,`rgba(${NAVY},.55)`);x.fillStyle=vg;x.fillRect(0,0,W,H);
  const b=img('baloes.webp');if(pronta(b)){const bw=470;x.drawImage(b,W-bw-6,30,bw,b.height*bw/b.width)}
  CONF.forEach(([cx,cy,s,q,cor])=>{x.fillStyle=`rgba(${cor},.9)`;if(q)x.fillRect(cx,cy,s,s/2);else{x.beginPath();x.arc(cx,cy,s/3,0,7);x.fill()}});
  degrade(x,1250,260,.92);
  txt(x,'#GABIFEZ12',W/2,1420,'700 150px "Barlow Condensed",sans-serif',OURO,'center',1);
  x.fillStyle='rgba(227,197,128,.7)';x.fillRect(W/2-300,1517,600,2);
  txt(x,'AGÊNCIA EXIT  ·  OPERAÇÃO XII',W/2,1560,'600 28px "IBM Plex Mono",monospace','#F0F0F0');
  tags(x,1610)
};
CENAS.revista=(x,c)=>{cam(x,c);const r=img('revista.webp');if(pronta(r))x.drawImage(r,0,(H-r.height*W/r.width)/2,W,r.height*W/r.width)};
CENAS.polaroid=(x,c)=>{
  desfoca(x,c);caixa(x,0,0,W,H,.35);
  const p=img('polaroid.webp'),oy=(H-1935)/2;
  x.save();x.beginPath();x.rect(139,384+oy,790,1054);x.clip();cam(x,c);x.restore();
  if(pronta(p))x.drawImage(p,0,oy,W,p.height*W/p.width)
};
CENAS.scanner=(x,c)=>{
  const st=c.st;cam(x,c);caixa(x,0,0,W,H,.28);
  const hud=img('hud.jpg');if(pronta(hud)){const s=1000;x.save();x.globalCompositeOperation='screen';x.drawImage(hud,W/2-s/2,700-s/2,s,s);x.restore()}
  caixa(x,0,0,W,118,.82);x.fillStyle='rgba(227,197,128,.63)';x.fillRect(0,117,W,2);
  txt(x,'AGÊNCIA EXIT',48,58,'600 30px "IBM Plex Mono",monospace',OURO,'left');txt(x,'SISTEMA ÍRIS · RECONHECIMENTO FACIAL',48,96,'600 20px "IBM Plex Mono",monospace',CIANO,'left');
  if(c.final||(Date.now()/600|0)%2){x.fillStyle='#EB5050';x.beginPath();x.arc(W-139,59,11,0,7);x.fill()}txt(x,'REC',W-48,58,'600 30px "IBM Plex Mono",monospace','#EB5050','right');
  caixa(x,260,1168,560,80,.85,OURO);txt(x,'IDENTIFICADO · 99,9%',W/2,1210,'700 54px "Barlow Condensed",sans-serif',OURO);
  caixa(x,48,1290,W-96,250,.8,'rgba(227,197,128,.47)');
  txt(x,'PERFIL DO AGENTE',80,1330,'600 24px "IBM Plex Mono",monospace',CIANO,'left');
  txt(x,PERFIS[st.perfil||0],80,1410,'700 92px "Barlow Condensed",sans-serif','#fff','left');
  txt(x,(st.eq?'EQUIPE '+st.eq+'  ·  ':'')+'NÍVEL DE ACESSO 3  ·  OPERAÇÃO XII',80,1500,'600 22px "IBM Plex Mono",monospace',OURO,'left');
  tags(x,1600)
};
CENAS.noite=(x,c)=>{
  cam(x,c);
  x.globalCompositeOperation='saturation';x.fillStyle='#808080';x.fillRect(0,0,W,H);
  x.globalCompositeOperation='multiply';x.fillStyle='rgb(60,255,110)';x.fillRect(0,0,W,H);
  x.globalCompositeOperation='screen';x.fillStyle='rgba(20,60,25,.55)';x.fillRect(0,0,W,H);x.globalCompositeOperation='source-over';
  for(let y=0;y<H;y+=5){x.fillStyle='rgba(0,0,0,.16)';x.fillRect(0,y,W,1)}
  const vg=x.createRadialGradient(W/2,H*.45,W*.38,W/2,H*.45,W*1.05);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.8)');x.fillStyle=vg;x.fillRect(0,0,W,H);

function falar(t){try{const u=new SpeechSynthesisUtterance(t.replace(/\n/g,'. '));u.lang='pt-BR';u.rate=.95;u.pitch=.9;const v=speechSynthesis.getVoices().find(v=>/pt[-_]BR/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
/* ================== TELÃO (transmissão da ÍRIS) ================== */
/* Áudio: audio/iris_N.mp3 (voz do Runway já tratada). TEMPOS: início de cada frase em segundos (gerado junto com o áudio). */
const AUD={abertura:1,pasta:2,pericia:3,mandado:4,lasers:5,fim:6};
const TEMPOS={"1": [0, 3.54, 7.16], "2": [0, 2.98, 6.91], "3": [0, 5.49], "4": [0, 1.74], "5": [0, 3.94, 7.07], "6": [0, 1.28, 4.97, 8.06]};
let anim=0, an=null, audEl=null, srcNode=null, subT=[], falando=false;
function frases(t){return t.split('\n').map(x=>x.trim()).filter(Boolean)}
function desenha(){
  const r=$('#ring'),w=$('#wave');if(!r)return;const g=r.getContext('2d'),h=w.getContext('2d');
  const N=96, R=r.width/2, base=R*0.56;
  let f=new Uint8Array(256), td=new Uint8Array(1024);
  if(an){an.getByteFrequencyData(f);an.getByteTimeDomainData(td)}else if(falando){const t=performance.now()/1000,e=.55+.45*Math.abs(Math.sin(t*2.3))*Math.abs(Math.sin(t*.7+1));for(let i=0;i<256;i++)f[i]=Math.max(0,Math.min(255,(200-i*.7)*e*(.75+.25*Math.sin(t*9+i*.4))));for(let i=0;i<1024;i++){const x=i/1023,env=Math.pow(Math.sin(x*Math.PI),1.4);td[i]=128+env*e*80*(Math.sin(i*.09+t*14)*.55+Math.sin(i*.27+t*23)*.3+Math.sin(i*.021+t*5)*.25)}}else{td.fill(128)}
  g.clearRect(0,0,r.width,r.height);
  g.strokeStyle='rgba(201,162,74,.28)';g.lineWidth=2;g.beginPath();g.arc(R,R,base-14,0,7);g.stroke();
  g.strokeStyle='rgba(159,178,204,.18)';g.lineWidth=1;g.beginPath();g.arc(R,R,R*0.95,0,7);g.stroke();
  for(let k=0;k<N;k++){
    const idx=k<N/2?k:N-1-k; const v=f[2+Math.floor(Math.pow(idx/(N/2),1.5)*150)]/255; const len=8+v*v*R*0.36;
    const a=k/N*Math.PI*2-Math.PI/2; const x1=R+Math.cos(a)*base, y1=R+Math.sin(a)*base, x2=R+Math.cos(a)*(base+len), y2=R+Math.sin(a)*(base+len);
    g.strokeStyle=v>0.55?'#E3C580':'rgba(227,197,128,'+(0.35+v*0.6)+')';g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
  }
  h.clearRect(0,0,w.width,w.height);h.strokeStyle='rgba(255,255,255,.12)';h.lineWidth=1;h.beginPath();h.moveTo(0,w.height/2);h.lineTo(w.width,w.height/2);h.stroke();
  h.strokeStyle='#E3C580';h.lineWidth=3;h.beginPath();
  for(let i=0;i<td.length;i++){const x=i/(td.length-1)*w.width,y=w.height/2+(td[i]-128)/128*w.height*0.9;i?h.lineTo(x,y):h.moveTo(x,y)}h.stroke();
  const c=$('#stClk');if(c)c.textContent=new Date().toLocaleTimeString('pt-BR');
  anim=requestAnimationFrame(desenha);
}
function abrirPalco(alerta){
  setTimeout(()=>{try{musAplica()}catch(e){}},0);
  const st=$('#stage');st.classList.remove('sai','entra','alerta');void st.offsetWidth;st.classList.add('on','entra');if(alerta)st.classList.add('alerta');
  $('#stSub').textContent='';cancelAnimationFrame(anim);desenha();
  try{document.documentElement.requestFullscreen&&!document.fullscreenElement&&document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}
}
/* timers de cena guardados: uma cena nova ou FECHAR cancela tudo o que estava agendado da anterior */
let cenaT=[],GEN=0,sirAb=false;const agenda=(f,ms)=>{const t=setTimeout(f,ms);cenaT.push(t);return t};
function limpaCena(){GEN++;if(sirAb){sirAb=false;sireneOff()}cenaT.forEach(clearTimeout);cenaT=[];subT.forEach(clearTimeout);subT=[];if(audEl){audEl.onended=null;audEl.ontimeupdate=null;audEl.onerror=null;audEl.pause()}try{speechSynthesis.cancel()}catch(e){}}
function transmitir(id,opt={}){
  if(!opt.jaAberto)abrirPalco(opt.alerta);
  const fr=frases(FALAS[id]); const n=AUD[id]; const g=GEN;
  if(id==='abertura'&&!opt.semJingle){let foi=false;const segue=()=>{if(foi||g!==GEN)return;foi=true;transmitir(id,Object.assign({},opt,{semJingle:true,jaAberto:true}))};
    agenda(()=>{somCurto('audio/jingle.mp3',1,segue);agenda(segue,15000)},600);return}
  agenda(()=>{
    tone(880,.09,'sine',.12);tone(1320,.12,'sine',.1,.1);            /* bipe de ativação */
    agenda(()=>tocarVoz(id,n,fr),450);
  },1100);
}
function tocarVoz(id,n,fr){
  const a=ac();
  if(!audEl){audEl=new Audio();audEl.preload='auto';srcNode=a.createMediaElementSource(audEl);an=a.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=.72;srcNode.connect(an);an.connect(a.destination)}
  const tempos=(TEMPOS[n]||[]);
  subT.forEach(clearTimeout);subT=[];
  let falhou=false;
  audEl.onplaying=null;
  audEl.ontimeupdate=()=>{const c=audEl.currentTime,d=audEl.duration||1;let k=0;fr.forEach((f,i)=>{const t=tempos[i]!=null?tempos[i]:i*(d/fr.length);if(c>=t)k=i});const s=$('#stSub');if(s&&s.textContent!==fr[k])s.textContent=fr[k]};
  audEl.onended=()=>{tone(1320,.09,'sine',.1);tone(880,.14,'sine',.1,.1);if(id!=='fim')agenda(fecharPalco,2600)};
  audEl.onerror=()=>{if(falhou)return;falhou=true;falando=true;let i=0;const prox=()=>{if(i<fr.length){$('#stSub').textContent=fr[i++];subT.push(setTimeout(prox,Math.max(2200,fr[i-1].length*70)))}else{falando=false;if(id!=='fim')subT.push(setTimeout(fecharPalco,2600))}};prox();falar(FALAS[id])};
  audEl.src='audio/iris_'+n+'.mp3';audEl.currentTime=0;
  const er=audEl.onerror;audEl.play().then(()=>{if(audEl.ontimeupdate)audEl.ontimeupdate()}).catch(()=>{if(audEl.onerror===er)er()});
}
function fecharPalco(){const st=$('#stage');st.classList.add('sai');agenda(stageOff,1600)}
function stageOff(){const st=$('#stage');st.classList.remove('on','sai','entra','alerta');setTimeout(()=>{try{musAplica()}catch(e){}},0);cancelAnimationFrame(anim);limpaCena();sireneOff();}

  try{for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){const l=buf.slice(0,i).trim();buf=buf.slice(i+1);serLinha(l)}}}catch(e){}

function tvAnel(){
  const r=$('#tvring');if(!r)return;const g=r.getContext('2d'),R=r.width/2,base=R*.6,N=120,t=performance.now()/1000;
  g.clearRect(0,0,r.width,r.height);

  for(const [rr,a] of [[R*.97,.15],[base-18,.25+.2*resp]]){g.strokeStyle=`rgba(201,162,74,${a})`;g.lineWidth=3;g.beginPath();g.arc(R,R,rr,0,7);g.stroke()}
  g.setLineDash([6,14]);g.strokeStyle='rgba(159,178,204,.35)';g.lineWidth=2;g.beginPath();g.arc(R,R,R*.86,t*.15,t*.15+7);g.stroke();g.setLineDash([]);
  for(let k=0;k<N;k++){const a=k/N*Math.PI*2-Math.PI/2,w=Math.abs(Math.sin(k*.5+t*1.6)),len=12+w*16*(.6+.4*resp);g.strokeStyle=`rgba(227,197,128,${.22+.4*w})`;g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(R+Math.cos(a)*base,R+Math.sin(a)*base);g.lineTo(R+Math.cos(a)*(base+len),R+Math.sin(a)*(base+len));g.stroke()}
  g.strokeStyle='rgba(227,197,128,.9)';g.lineWidth=6;g.beginPath();g.arc(R,R,R*.86,t*.9,t*.9+.8);g.stroke();
  if(document.body.classList.contains('tvmode'))requestAnimationFrame(tvAnel);
}
